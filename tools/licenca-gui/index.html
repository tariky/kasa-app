<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Pazar licence</title>
<style>
  :root { --bg:#f6f5f2; --kartica:#fff; --tekst:#1c1b19; --blijed:#6b6860; --linija:#e3e0d8; --akcent:#1f5f4a; --crvena:#b3261e; --zuta:#8a5a00; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--tekst); }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .pod { color: var(--blijed); margin: 0 0 24px; font-size: 13px; }
  .red { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .red { grid-template-columns: 1fr; } }
  section { background: var(--kartica); border:1px solid var(--linija); border-radius: 10px; padding: 18px; }
  h2 { font-size: 14px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--blijed); }
  label { display:block; font-size:12px; color:var(--blijed); margin: 10px 0 4px; }
  input, textarea { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--linija); border-radius:7px; background:#fff; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: vertical; min-height: 70px; word-break: break-all; }
  input:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--akcent) 35%, transparent); border-color: var(--akcent); }
  .brzo { display:flex; gap:6px; flex-wrap: wrap; margin-top: 6px; }
  .brzo button { background:#fff; color:var(--tekst); border:1px solid var(--linija); padding:4px 10px; font-weight: 500; }
  .brzo button.aktivno { border-color: var(--akcent); color: var(--akcent); background: color-mix(in srgb, var(--akcent) 8%, #fff); }
  button { font:inherit; font-weight:600; border:0; border-radius:7px; padding:9px 14px; background:var(--akcent); color:#fff; cursor:pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .dugmad { display:flex; gap:8px; margin-top: 14px; align-items:center; }
  .sekundarno { background:#fff; color:var(--tekst); border:1px solid var(--linija); }
  .poruka { margin-top: 10px; font-size: 13px; min-height: 1.4em; }
  .greska { color: var(--crvena); }
  .ok { color: var(--akcent); }
  .rezultat { margin-top: 14px; }
  .rezultat[hidden] { display:none; }
  .info { display:grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 10px; font-size: 13px; }
  .info dt { color: var(--blijed); }
  .info dd { margin: 0; }
  table { width:100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align:left; padding: 8px 6px; border-bottom: 1px solid var(--linija); vertical-align: middle; }
  th { font-size: 12px; color: var(--blijed); font-weight: 500; }
  td.akcija { text-align: right; white-space: nowrap; }
  td.akcija button { padding: 4px 10px; font-size: 12px; }
  .znacka { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
  .z-ok { background:#e3f1ea; color: var(--akcent); }
  .z-uskoro { background:#fbefd5; color: var(--zuta); }
  .z-istekla { background:#f7e1df; color: var(--crvena); }
  .prazno { color: var(--blijed); text-align:center; padding: 18px; }
  .sa-pretragom { display:flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .sa-pretragom h2 { margin: 0; }
  .sa-pretragom input { max-width: 240px; }
  .tabela-omot { overflow-x: auto; }
  #kljuc-greska { background:#f7e1df; color: var(--crvena); padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <h1>Pazar licence</h1>
  <p class="pod" id="kljuc-info">Učitavam…</p>
  <div id="kljuc-greska" hidden></div>

  <div class="red">
    <section>
      <h2>Nova licenca</h2>
      <form id="forma-izdaj">
        <label for="klijent">Klijent</label>
        <input id="klijent" list="klijenti" autocomplete="off" required placeholder="npr. Pekara Šeher">
        <datalist id="klijenti"></datalist>

        <label for="vrijediDo">Važi do (uključivo)</label>
        <input id="vrijediDo" type="date" required>
        <div class="brzo" id="brzo">
          <button type="button" data-dana="31">1 mjesec</button>
          <button type="button" data-dana="92">3 mjeseca</button>
          <button type="button" data-dana="183">6 mjeseci</button>
          <button type="button" data-dana="366">1 godina</button>
        </div>

        <label for="uredjaj">ID uređaja (opcionalno)</label>
        <input id="uredjaj" autocomplete="off" placeholder="prazno = važi na bilo kojem računaru">

        <div class="dugmad"><button type="submit">Izdaj licencu</button></div>
        <div class="poruka" id="poruka-izdaj"></div>
      </form>

      <div class="rezultat" id="rezultat" hidden>
        <label for="token">Token za klijenta</label>
        <textarea id="token" readonly rows="4"></textarea>
        <div class="dugmad">
          <button type="button" id="kopiraj">Kopiraj</button>
          <span class="poruka ok" id="kopirano"></span>
        </div>
      </div>
    </section>

    <section>
      <h2>Provjeri token</h2>
      <form id="forma-provjeri">
        <label for="token-provjera">Zalijepi token</label>
        <textarea id="token-provjera" rows="5" placeholder="PAZAR1.…" required></textarea>
        <div class="dugmad"><button type="submit" class="sekundarno">Provjeri</button></div>
      </form>
      <div class="poruka" id="poruka-provjeri"></div>
      <dl class="info" id="info-provjeri" hidden></dl>
    </section>
  </div>

  <section style="margin-top:16px">
    <div class="sa-pretragom">
      <h2>Izdane licence</h2>
      <input id="pretraga" type="search" placeholder="Traži klijenta…">
    </div>
    <div class="tabela-omot">
      <table>
        <thead><tr><th>Klijent</th><th>Važi do</th><th>Status</th><th>Uređaj</th><th>Izdana</th><th></th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let izdane = [];

function danas() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function uDatum(s) { const [g, m, d] = s.split('-').map(Number); return new Date(g, m - 1, d); }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function prikaz(s) { const [g, m, d] = s.split('-'); return `${d}.${m}.${g}.`; }
function preostalo(vrijediDo) { return Math.round((uDatum(vrijediDo) - danas()) / 86400000); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

function znacka(vrijediDo) {
  const n = preostalo(vrijediDo);
  if (n < 0) return `<span class="znacka z-istekla">istekla prije ${-n} d</span>`;
  if (n <= 7) return `<span class="znacka z-uskoro">${n === 0 ? 'ističe danas' : `još ${n} d`}</span>`;
  return `<span class="znacka z-ok">još ${n} d</span>`;
}

async function api(put, tijelo) {
  const r = await fetch(put, tijelo ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(tijelo) } : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.greska || 'Greška');
  return j;
}

function postaviDane(dana) {
  const d = danas(); d.setDate(d.getDate() + dana - 1);
  $('vrijediDo').value = iso(d);
  oznaciBrzo();
}
function oznaciBrzo() {
  for (const b of $('brzo').querySelectorAll('button')) {
    const d = danas(); d.setDate(d.getDate() + Number(b.dataset.dana) - 1);
    b.classList.toggle('aktivno', iso(d) === $('vrijediDo').value);
  }
}

function crtajListu() {
  const q = $('pretraga').value.trim().toLowerCase();
  // Samo zadnja licenca po klijentu+uređaju je bitna za status.
  const vidjeno = new Set();
  const redovi = izdane.filter((l) => !q || l.klijent.toLowerCase().includes(q));
  $('lista').innerHTML = redovi.length ? redovi.map((l, i) => {
    const kljuc = l.klijent + '|' + (l.uredjaj || '');
    const starija = vidjeno.has(kljuc); vidjeno.add(kljuc);
    return `<tr style="${starija ? 'opacity:.5' : ''}">
      <td>${esc(l.klijent)}</td>
      <td>${prikaz(l.vrijediDo)}</td>
      <td>${starija ? '<span style="font-size:12px;color:var(--blijed)">zamijenjena</span>' : znacka(l.vrijediDo)}</td>
      <td>${l.uredjaj ? esc(l.uredjaj) : '<span style="color:var(--blijed)">bilo koji</span>'}</td>
      <td>${prikaz(l.izdana)}</td>
      <td class="akcija">
        <button class="sekundarno" data-kopiraj="${esc(l.token)}">Kopiraj</button>
        <button class="sekundarno" data-produzi="${i}">Produži</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" class="prazno">${q ? 'Nema rezultata' : 'Još nema izdanih licenci'}</td></tr>`;

  const imena = [...new Set(izdane.map((l) => l.klijent))];
  $('klijenti').innerHTML = imena.map((k) => `<option value="${esc(k)}">`).join('');
}

async function ucitaj() {
  try {
    const s = await api('/api/stanje');
    izdane = s.izdane;
    $('kljuc-info').textContent = `Ključ: ${s.kljuc}`;
    crtajListu();
  } catch (e) {
    $('kljuc-info').textContent = '';
    $('kljuc-greska').textContent = e.message;
    $('kljuc-greska').hidden = false;
    for (const b of document.querySelectorAll('form button')) b.disabled = true;
  }
}

async function kopiraj(tekst, gdje) {
  await navigator.clipboard.writeText(tekst);
  if (gdje) { gdje.textContent = 'Kopirano'; setTimeout(() => (gdje.textContent = ''), 1500); }
}

$('brzo').addEventListener('click', (e) => { if (e.target.dataset.dana) postaviDane(Number(e.target.dataset.dana)); });
$('vrijediDo').addEventListener('input', oznaciBrzo);
$('pretraga').addEventListener('input', crtajListu);

$('forma-izdaj').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('poruka-izdaj').textContent = '';
  try {
    const l = await api('/api/izdaj', { klijent: $('klijent').value, vrijediDo: $('vrijediDo').value, uredjaj: $('uredjaj').value });
    $('token').value = l.token;
    $('rezultat').hidden = false;
    $('poruka-izdaj').className = 'poruka ok';
    $('poruka-izdaj').textContent = `Izdana za ${l.klijent}, važi do ${prikaz(l.vrijediDo)}.`;
    izdane.unshift(l);
    crtajListu();
    kopiraj(l.token, $('kopirano'));
  } catch (err) {
    $('poruka-izdaj').className = 'poruka greska';
    $('poruka-izdaj').textContent = err.message;
  }
});

$('kopiraj').addEventListener('click', () => kopiraj($('token').value, $('kopirano')));

$('lista').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.kopiraj) { kopiraj(b.dataset.kopiraj); b.textContent = 'Kopirano'; setTimeout(() => (b.textContent = 'Kopiraj'), 1500); }
  if (b.dataset.produzi) {
    const l = izdane.filter((x) => { const q = $('pretraga').value.trim().toLowerCase(); return !q || x.klijent.toLowerCase().includes(q); })[Number(b.dataset.produzi)];
    $('klijent').value = l.klijent;
    $('uredjaj').value = l.uredjaj || '';
    // Nastavlja se od starog isteka ako još važi, inače od danas.
    const pocetak = preostalo(l.vrijediDo) >= 0 ? uDatum(l.vrijediDo) : danas();
    const d = new Date(pocetak); d.setMonth(d.getMonth() + 1);
    if (preostalo(l.vrijediDo) < 0) d.setDate(d.getDate() - 1);
    $('vrijediDo').value = iso(d);
    oznaciBrzo();
    $('rezultat').hidden = true;
    $('poruka-izdaj').textContent = '';
    $('klijent').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('klijent').focus();
  }
});

$('forma-provjeri').addEventListener('submit', async (e) => {
  e.preventDefault();
  const info = $('info-provjeri');
  info.hidden = true;
  try {
    const r = await api('/api/provjeri', { token: $('token-provjera').value });
    const razlozi = { potpis: 'Potpis ne odgovara — token je lažan ili izmijenjen', istekla: 'Licenca je istekla', uredjaj: 'Pogrešan uređaj' };
    $('poruka-provjeri').className = 'poruka ' + (r.ok ? 'ok' : 'greska');
    $('poruka-provjeri').textContent = r.ok ? 'Token je ispravan' : razlozi[r.razlog] || r.razlog;
    if (r.razlog !== 'potpis') {
      const l = r.licenca;
      info.innerHTML = `<dt>Klijent</dt><dd>${esc(l.klijent)}</dd><dt>Važi do</dt><dd>${prikaz(l.vrijediDo)} ${znacka(l.vrijediDo)}</dd><dt>Izdana</dt><dd>${prikaz(l.izdana)}</dd><dt>Uređaj</dt><dd>${l.uredjaj ? esc(l.uredjaj) : 'bilo koji'}</dd>`;
      info.hidden = false;
    }
  } catch (err) {
    $('poruka-provjeri').className = 'poruka greska';
    $('poruka-provjeri').textContent = err.message;
  }
});

postaviDane(31);
ucitaj();
</script>
</body>
</html>
