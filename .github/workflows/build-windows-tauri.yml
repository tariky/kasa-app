name: Build Windows (Tauri)

# Ručno pokretanje; Electron build (build-windows.yml) ostaje kakav jeste.
on:
  workflow_dispatch:

# Build samo čita repo; artefakti idu kroz upload-artifact.
permissions:
  contents: read

jobs:
  build-windows-tauri:
    runs-on: windows-2022

    steps:
      # Akcije su pinovane na commit SHA (tag u komentaru) — pomjeren tag ne mijenja build.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Vrh grane `stable` akcije; sam toolchain je i dalje stable.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Tačno verzije iz bun.lock; pada ako lockfile ne odgovara package.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # DIJAGNOSTIKA (privremeno): storno test sam, s tragom zahtjeva i stderr-om
      # ugovor-servera, uz 30 s umjesto 5 s — da li je spor ili visi, i gdje.
      - name: Diag storno timeout
        continue-on-error: true
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml -p pazar-backend --bin ugovor-server
          $test = Start-Process -FilePath bun -ArgumentList 'test','src/ipc/ugovor/audit.ugovor.test.ts','-t','"adminom koji je odobrio"','--timeout','30000' -NoNewWindow -PassThru
          Start-Sleep -Seconds 15
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          Write-Host "cdb postoji: $(Test-Path $cdb)"
          Get-Process ugovor-server -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== stekovi ugovor-server pid $($_.Id)"
            & $cdb -p $_.Id -y "src-tauri\target\debug" -c ".lines -e; ~*kn 30; qd"
          }
          $test | Wait-Process -Timeout 90 -ErrorAction SilentlyContinue
          Get-Process ugovor-server, bun -ErrorAction SilentlyContinue | Stop-Process -Force
        env:
          KASA_BACKEND: rust
          KASA_UGOVOR_LOG: '1'
          KASA_UGOVOR_TRAG: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      # Isti ugovorni testovi kao nad TS backendom — na Windowsu hvataju razlike
      # u putanjama i fajlovima (backup/uvoz baze). Privremeni folderi (baza po
      # testu) idu na D: — na C: runnera su SQLite upisi toliko spori da test
      # sa PIN-ovima pređe bun-ovih 5 s.
      - name: Contract tests over Rust backend
        run: bun run test:rust
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p pazar-backend
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Build Tauri installer
        run: bun run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pazar-windows-tauri
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
