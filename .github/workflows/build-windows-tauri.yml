name: Build Windows (Tauri)

# Ručno pokretanje; Electron build (build-windows.yml) ostaje kakav jeste.
on:
  workflow_dispatch:

# Build samo čita repo; artefakti idu kroz upload-artifact.
permissions:
  contents: read

jobs:
  build-windows-tauri:
    runs-on: windows-2022
    # Zaglavljen test inače drži runner do GitHub-ovog limita od 6 sati.
    timeout-minutes: 60

    steps:
      # Akcije su pinovane na commit SHA (tag u komentaru) — pomjeren tag ne mijenja build.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Vrh grane `stable` akcije; sam toolchain je i dalje stable.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Tačno verzije iz bun.lock; pada ako lockfile ne odgovara package.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ključ za R2 podatke u licenci (src/lib/backupKljuc.ts) nije u javnom
      # repou; Electron ga uvozi, Rust ga ugrađuje (include_str!). Bez tajne
      # build pada — ne smije izaći verzija u kojoj backup tiho ne radi.
      - name: Backup key
        shell: bash
        env:
          PAZAR_BACKUP_KLJUC_HEX: ${{ secrets.PAZAR_BACKUP_KLJUC_HEX }}
        run: |
          if [[ ! "$PAZAR_BACKUP_KLJUC_HEX" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Nedostaje tajna PAZAR_BACKUP_KLJUC_HEX (64 hex znaka)"; exit 1
          fi
          printf "export const BACKUP_KLJUC_HEX = '%s';\n" "$PAZAR_BACKUP_KLJUC_HEX" > src/lib/backupKljuc.ts

      # Isti ugovorni testovi kao nad TS backendom — na Windowsu hvataju razlike
      # u putanjama i fajlovima (backup/uvoz baze). Privremeni folderi (baza po
      # testu) idu na D: — na C: runnera su SQLite upisi i do 20× sporiji.
      - name: Contract tests over Rust backend
        run: bun run test:rust
        timeout-minutes: 20
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p pazar-backend
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Build Tauri installer
        run: bun run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pazar-windows-tauri
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
