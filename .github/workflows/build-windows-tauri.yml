name: Build Windows (Tauri)

# Ručno pokretanje; Electron build (build-windows.yml) ostaje kakav jeste.
on:
  workflow_dispatch:

jobs:
  build-windows-tauri:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      # Isti ugovorni testovi kao nad TS backendom — na Windowsu hvataju razlike
      # u putanjama i fajlovima (backup/uvoz baze).
      - name: Contract tests over Rust backend
        run: bun run test:rust

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p pazar-backend

      - name: Build Tauri installer
        run: bun run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pazar-windows-tauri
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
