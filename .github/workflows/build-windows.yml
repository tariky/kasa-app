name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Build samo čita repo; artefakti idu kroz upload-artifact.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      # Akcije su pinovane na commit SHA (tag u komentaru) — pomjeren tag ne mijenja build.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Tačno verzije iz package-lock.json; pada ako lockfile ne odgovara package.json.
      - name: Install dependencies
        run: npm ci

      # --no-install: samo lokalno instalirani alati (devDependencies), ništa s mreže.
      - name: Rebuild native modules for Electron
        run: npx --no-install electron-rebuild -f -w better-sqlite3

      - name: Convert PNG icon to ICO
        run: npx --no-install png-to-ico src/assets/icon.png > src/assets/icon.ico

      - name: Make Windows installer
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kasa-windows
          path: out/make/**/*
          retention-days: 30
