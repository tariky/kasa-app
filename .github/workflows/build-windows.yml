name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Convert PNG icon to ICO
        run: npx png-to-ico src/assets/icon.png > src/assets/icon.ico

      - name: Package app
        run: npm run package

      - name: Verify better-sqlite3 in packaged app
        run: |
          echo "=== Checking for better-sqlite3 ==="
          dir out\kasa-win32-x64\resources\app\node_modules\better-sqlite3 /s /b 2>NUL || echo "NOT FOUND in resources/app"
          dir out\kasa-win32-x64\resources\app\node_modules\better-sqlite3\build 2>NUL || echo "No build dir"
        shell: cmd

      - name: Make Windows installer
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasa-windows
          path: out/make/**/*
          retention-days: 30
