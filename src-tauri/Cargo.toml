[package]
name = "pazar"
version = "1.0.0"
description = "Pazar POS application for Bosnian market"
authors = ["Tarik Caplja <tarik@lunatik.ba>"]
edition = "2021"

[lib]
name = "pazar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["preserve_order"] }
pazar-backend = { path = "backend" }

[workspace]
members = ["backend"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
