[package]
name = "pazar"
version = "1.0.0"
description = "Pazar POS application for Bosnian market"
authors = ["Tarik Caplja <tarik@lunatik.ba>"]
edition = "2021"

[lib]
name = "pazar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["preserve_order"] }
pazar-backend = { path = "backend" }

# Samo Windows: gašenje WebView2 tipki preglednika (F5 reload…), iste verzije kao u wry-u.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[workspace]
members = ["backend"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# PIN heš (PBKDF2-HMAC-SHA256, 100000 iteracija) je bez optimizacije ~0,5 s po
# provjeri, a prijava provjerava svakog korisnika — ugovorni testovi i `tauri
# dev` bi puzali. Generički PBKDF2/HMAC kod se instancira u backendu, pa se
# optimizuje backend (i SHA-256 kompresija); ljuska ostaje debug.
[profile.dev.package.pazar-backend]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
